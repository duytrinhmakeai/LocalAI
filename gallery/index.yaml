# LocalAI Local Gallery
# This file contains model definitions for local model gallery

models:
  - name: "phi-2"
    description: "Phi-2 is a 2.7B parameter language model by Microsoft"
    license: "mit"
    urls:
      - "https://huggingface.co/TheBloke/phi-2-GGUF/resolve/main/phi-2.Q8_0.gguf"
    icon: "https://huggingface.co/microsoft/phi-2/resolve/main/phi-2-logo.png"
    tags:
      - "text-generation"
      - "chat"
    parameters:
      model: "phi-2.Q8_0.gguf"
      backend: "llama-cpp"
      context_size: 2048
      threads: 4
      
  - name: "whisper-base"
    description: "Whisper base model for speech recognition"
    license: "mit"
    urls:
      - "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
    tags:
      - "audio"
      - "speech-to-text"
    parameters:
      model: "ggml-base.bin"
      backend: "whisper"
      
  - name: "bert-embeddings"
    description: "BERT model for text embeddings"
    license: "apache-2.0"
    urls:
      - "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2"
    tags:
      - "embeddings"
    parameters:
      model: "all-MiniLM-L6-v2"
      backend: "bert-embeddings"